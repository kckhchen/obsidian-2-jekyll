name: Obsidian to Jekyll
description: Sync shared notes from an Obsidian vault to a Jekyll site.
author: kckhchen

branding:
  icon: file-text
  color: purple

inputs:
  jekyll-repo:
    {
      description: "Jekyll site repo (owner/name). Must differ from your vault repo.",
      required: true,
      default: "",
    }
  jekyll-dir: { description: "Path to the Jekyll site.", default: "site" }
  vault-dir: { description: "Path to the Obsidian vault.", default: "vault" }
  token:
    {
      description: "Token with contents:write and pull-requests:write on jekyll-repo.",
      default: "",
    }
  args: { description: "Arguments passed to main.py.", default: "--force" }
  mode:
    {
      description: "'pr' opens or updates a pull request, 'push' commits straight to the default branch, 'none' syncs only.",
      default: "pr",
    }
  branch:
    {
      description: "Branch used in pr mode. Fixed name, so repeated runs update the same PR.",
      default: "obsidian-sync",
    }
  commit-message:
    {
      description: "{sha} is replaced with the short SHA.",
      default: "chore: sync from vault @ {sha}",
    }
  max-deletions:
    {
      description: "Warn above this many deletions. Never fails the run. -1 disables the warning.",
      default: "10",
    }
  require-date:
    {
      description: "Fail if a shared note has no explicit date.",
      default: "true",
    }
  optimise-images:
    { description: "Compress PNG/JPEG before committing.", default: "false" }
  python-version: { default: "3.13" }

outputs:
  changed:
    description: "true when the sync produced a change."
    value: ${{ steps.diff.outputs.changed }}
  deletions:
    description: "Number of files the sync would delete."
    value: ${{ steps.diff.outputs.deletions }}
  posts-written:
    description: "Number of post files after the sync."
    value: ${{ steps.sync.outputs.posts }}
  pull-request-url:
    description: "URL of the pull request opened or updated, empty otherwise."
    value: ${{ steps.pr.outputs.url }}

runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
      with: { path: "${{ inputs.vault-dir }}" }

    - name: Check configuration
      if: inputs.jekyll-repo == ''
      shell: bash
      run: |
        echo "::error::jekyll-repo is required — your vault and Jekyll site must be separate repositories."
        exit 1

    - uses: actions/checkout@v4
      with:
        repository: ${{ inputs.jekyll-repo }}
        token: ${{ inputs.token }}
        path: ${{ inputs.jekyll-dir }}

    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - shell: bash
      run: pip install --quiet -r "${{ github.action_path }}/requirements.txt"

    - name: Require explicit dates
      if: inputs.require-date == 'true'
      shell: bash
      working-directory: ${{ github.workspace }}/${{ inputs.vault-dir }}
      run: |
        missing=$(grep -rlE '^share:[[:space:]]*true' --include='*.md' . 2>/dev/null \
                  | xargs -r grep -LE '^date:' || true)
        if [ -n "$missing" ]; then
          echo "::error::Shared notes without an explicit 'date:' would get an unstable"
          echo "::error::permalink, because git does not preserve file timestamps."
          echo "$missing" | while read -r f; do echo "::error file=$f::missing date:"; done
          exit 1
        fi

    - name: Sync
      id: sync
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        VAULT_DIR: ${{ github.workspace }}/${{ inputs.vault-dir }}
        JEKYLL_DIR: ${{ github.workspace }}/${{ inputs.jekyll-dir }}
      run: |
        python main.py ${{ inputs.args }}
        echo "posts=$(find "$JEKYLL_DIR/_posts" -name '*.md' | wc -l)" >> "$GITHUB_OUTPUT"

    - name: Optimise images
      if: inputs.optimise-images == 'true'
      shell: bash
      working-directory: ${{ github.workspace }}/${{ inputs.jekyll-dir }}
      run: |
        sudo apt-get install -y -qq optipng jpegoptim
        find assets -name '*.png' -print0 | xargs -0 -r optipng -o2 -quiet
        find assets \( -name '*.jpg' -o -name '*.jpeg' \) -print0 \
          | xargs -0 -r jpegoptim --strip-all --max=85 --quiet

    - name: Inspect changes
      id: diff
      shell: bash
      working-directory: ${{ github.workspace }}/${{ inputs.jekyll-dir }}
      run: |
        git add -A

        if git diff --cached --quiet; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
          echo "deletions=0" >> "$GITHUB_OUTPUT"
          echo "Nothing to publish."
          exit 0
        fi

        echo "changed=true" >> "$GITHUB_OUTPUT"
        git diff --cached --stat

        deleted=$(git diff --cached --name-only --diff-filter=D | wc -l)
        echo "deletions=$deleted" >> "$GITHUB_OUTPUT"

        limit='${{ inputs.max-deletions }}'
        if [ "$limit" != "-1" ] && [ "$deleted" -gt "$limit" ]; then
          echo "::warning::$deleted files would be deleted (above the $limit warning threshold)."
          git diff --cached --name-only --diff-filter=D \
            | while read -r f; do echo "::warning::would delete $f"; done
        fi

    - name: Commit
      if: inputs.mode != 'none' && steps.diff.outputs.changed == 'true'
      shell: bash
      working-directory: ${{ github.workspace }}/${{ inputs.jekyll-dir }}
      run: |
        message='${{ inputs.commit-message }}'
        git config user.name  'obsidian-2-jekyll[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        if [ '${{ inputs.mode }}' = 'pr' ]; then
          git checkout -B '${{ inputs.branch }}'
        fi
        git commit --quiet -m "${message//\{sha\}/${GITHUB_SHA::7}}"

    - name: Push
      if: inputs.mode == 'push' && steps.diff.outputs.changed == 'true'
      shell: bash
      working-directory: ${{ github.workspace }}/${{ inputs.jekyll-dir }}
      run: git push

    - name: Open or update pull request
      id: pr
      if: inputs.mode == 'pr' && steps.diff.outputs.changed == 'true'
      shell: bash
      working-directory: ${{ github.workspace }}/${{ inputs.jekyll-dir }}
      env:
        GH_TOKEN: ${{ inputs.token || github.token }}
        BRANCH: ${{ inputs.branch }}
        DELETIONS: ${{ steps.diff.outputs.deletions }}
      run: |
        base=$(gh repo view --json defaultBranchRef --jq '.defaultBranchRef.name')
        git fetch --quiet origin "$base"
        git push --force origin "$BRANCH"

        {
          echo "Synced from \`${{ github.repository }}@${GITHUB_SHA::7}\`."
          echo
          echo '```'
          git diff --stat "origin/$base..$BRANCH"
          echo '```'
          if [ "$DELETIONS" -gt 0 ]; then
            echo
            echo "> [!WARNING]"
            echo "> This pull request deletes **$DELETIONS** file(s):"
            echo "> "
            git diff --name-only --diff-filter=D "origin/$base..$BRANCH" \
              | while read -r f; do echo "> - \`$f\`"; done
          fi
        } > "$RUNNER_TEMP/pr-body.md"

        existing=$(gh pr list --head "$BRANCH" --base "$base" --state open \
                     --json url --jq '.[0].url // empty')

        if [ -n "$existing" ]; then
          gh pr edit "$existing" --body-file "$RUNNER_TEMP/pr-body.md"
          echo "url=$existing" >> "$GITHUB_OUTPUT"
          echo "Updated $existing"
        else
          url=$(gh pr create \
            --base "$base" \
            --head "$BRANCH" \
            --title "chore: sync from vault @ ${GITHUB_SHA::7}" \
            --body-file "$RUNNER_TEMP/pr-body.md")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Opened $url"
        fi
